# End-to-end: build a real Fedora VM with vm-browser.sh (tests/e2e.sh) on GitHub's runner,
# which has KVM. The script runs in a Fedora container as a normal user, like on a desktop.
# Slow (about 15 minutes) and dependent on Fedora's mirrors, so it runs on pull requests that
# change the script, weekly, and on demand, and is not a required check.
name: e2e

on:
  pull_request:
    paths: ["vm-browser.sh", "tests/**", ".github/workflows/e2e.yml"]
  push:
    branches: [main]
    paths: ["vm-browser.sh", "tests/**", ".github/workflows/e2e.yml"]
  schedule:
    - cron: "41 5 * * 2"  # weekly
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}  # a new push supersedes the old PR run; main runs finish

permissions:
  contents: read

env:
  # Fedora 44, pinned by digest.
  IMAGE: registry.fedoraproject.org/fedora@sha256:b414c09be79dd1f32529b55b096b6bb30435d82ee16fbdbbabf8985eb5f86db0

jobs:
  fedora:
    name: e2e (Fedora cloud image)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # KVM for the container's user, and user namespaces for passt's sandbox (Ubuntu
      # restricts unprivileged ones through AppArmor).
      - name: KVM and user namespaces on the runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          # Ubuntu's AppArmor profiles for passt attach to /usr/bin/passt by path, so they would
          # also confine the container's passt and deny its user namespace. Unload them here.
          for f in /etc/apparmor.d/*passt* /etc/apparmor.d/*pasta*; do
            [ -f "$f" ] && { echo "unloading $f"; sudo apparmor_parser -R "$f" || true; }
          done
          ls -l /dev/kvm
      - name: End-to-end test in a Fedora container
        run: |
          # --privileged: passt sandboxes itself in a user namespace, which needs to write its
          # uid_map; Docker's default profile denies that even with seccomp unconfined. The
          # container is a throwaway on a throwaway runner; the script still runs as a normal user.
          docker run --rm --privileged \
            -v "$GITHUB_WORKSPACE:/src:ro" "$IMAGE" bash -euo pipefail -c '
              dnf -y -q --setopt=install_weak_deps=False install libvirt-client libvirt-daemon-kvm qemu-kvm qemu-img rpm-build \
                passt waypipe genisoimage openssh-clients curl gnupg2 iproute procps-ng util-linux shadow-utils rpm >/dev/null
              useradd -m ci
              # /run/user/<uid>, as on a desktop (the runner'"'"'s AppArmor profile for passt expects it).
              run=/run/user/$(id -u ci); install -d -o ci -m 700 "$run"
              cp -r /src /home/ci/vm-browser && chown -R ci: /home/ci/vm-browser
              runuser -u ci -- env E2E_HOSTILE_SSH_CONFIG=1 XDG_RUNTIME_DIR="$run" HOME=/home/ci /home/ci/vm-browser/tests/e2e.sh'
