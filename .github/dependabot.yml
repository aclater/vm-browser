# Keeps the commit-SHA pins in .github/workflows and the CI tools in .github/requirements current.
# Actions are pinned by SHA rather than tag so a moved tag can't change what runs in CI.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # New releases wait two weeks before a PR is opened.
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
  # Tools CI installs from PyPI by hash (.github/requirements), such as zizmor.
  - package-ecosystem: pip
    directory: /.github/requirements
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      ci-tools:
        patterns: ["*"]
    commit-message:
      prefix: ci
